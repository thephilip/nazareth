name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.extras }} · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core package alone: keyword search, no optional extras.
          - { python: "3.12", extras: test }
          - { python: "3.13", extras: test }
          - { python: "3.14", extras: test }
          # Everything: semantic search and the knowledge graph (tests use fakes,
          # never a real model or LLM).
          - { python: "3.14", extras: dev }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e ".[${{ matrix.extras }}]"
      - run: ruff check src tests
        if: matrix.extras == 'dev'
      - run: pytest -q

  install:
    name: install.sh · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
        if: runner.os == 'Linux'
      - run: sh install.sh --from . --yes
      - name: nazareth works from a fresh shell's PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nazareth --version
          cd "$(mktemp -d)" && git init -q && nazareth init --claude && nazareth status

  install-bare:
    # dash as /bin/sh and no uv: the strictest shell, and the uv bootstrap.
    name: install.sh · debian, no uv
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
      - run: sh install.sh --from . --yes
      - run: sh install.sh --yes  # the latest release, from GitHub
      - run: "$HOME/.local/bin/nazareth --version"
