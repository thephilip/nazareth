[project]
name = "nazareth"
version = "0.1.0"
description = "Agent-native memory layer and lens orchestration for local agentic coding workflows"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
search = [
    "model2vec>=0.4,<1",
    "numpy",
]
graph = [
    "nazareth[search]",
    "graphiti-core[falkordblite]>=0.31.2,<0.32",
    "httpx>=0.27",  # graphiti-core imports it without declaring it
]
dev = [
    "nazareth[graph]",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyyaml",
    "jsonschema",
]

[project.scripts]
nazareth = "nazareth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nazareth = ["templates/*/*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
